<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Atelier Book — Client Measurements</title>
  <style>
    :root{--ink:#29241f;--muted:#756d65;--paper:#fffdfa;--wash:#f5eee7;--accent:#9c4e43;--accent-dark:#783a32;--line:#e5dad1;--shadow:0 16px 45px rgba(58,38,25,.11)}
    *{box-sizing:border-box} body{margin:0;font-family:ui-rounded,"Avenir Next",Avenir,system-ui,sans-serif;color:var(--ink);background:var(--wash)} button,input,textarea,select{font:inherit}
    header{background:var(--ink);color:#fff8f2;padding:22px clamp(20px,5vw,74px);display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;gap:12px;align-items:center}.mark{width:35px;height:35px;border:1px solid #e9c8ae;border-radius:50%;display:grid;place-items:center;font-family:Georgia,serif;font-size:21px}.brand h1{font:600 18px Georgia,serif;margin:0;letter-spacing:.04em}.brand p{margin:3px 0 0;font-size:12px;color:#d2c5ba}.header-actions{display:flex;gap:10px}
    .button{border:0;border-radius:9px;padding:10px 15px;cursor:pointer;font-weight:700;transition:.18s}.button.primary{background:var(--accent);color:#fff}.button.primary:hover{background:var(--accent-dark)}.button.quiet{background:transparent;color:inherit;border:1px solid currentColor}.button.soft{background:#f4e4d9;color:var(--accent-dark)}
    main{max-width:1180px;margin:0 auto;padding:34px 22px 60px}.topline{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:23px}.topline h2{font:400 clamp(27px,4vw,39px) Georgia,serif;margin:0}.topline p{color:var(--muted);margin:7px 0 0}.search{width:min(350px,100%);padding:12px 14px;border:1px solid var(--line);background:var(--paper);border-radius:9px;outline-color:var(--accent)}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:27px}.stat{background:var(--paper);padding:18px 20px;border-radius:12px;border:1px solid var(--line)}.stat b{display:block;font:400 30px Georgia,serif;color:var(--accent)}.stat span{font-size:13px;color:var(--muted)}
    .layout{display:grid;grid-template-columns:1.2fr .8fr;gap:24px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.panel-head{padding:20px 22px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.panel-head h3{font:400 22px Georgia,serif;margin:0}.clients{padding:8px}.client{display:flex;align-items:center;gap:13px;padding:14px;border-radius:10px;cursor:pointer}.client:hover,.client.active{background:#fbf1ea}.avatar{width:41px;height:41px;border-radius:50%;background:#e7c7b7;color:var(--accent-dark);display:grid;place-items:center;font-weight:800}.client-info{min-width:0;flex:1}.client-name{font-weight:800}.client-meta{font-size:12px;color:var(--muted);margin-top:3px}.chevron{color:var(--muted)}
    .empty{padding:48px 22px;text-align:center;color:var(--muted)}.detail{padding:22px}.detail h3{font:400 27px Georgia,serif;margin:0 0 4px}.detail .sub{color:var(--muted);font-size:13px;margin-bottom:23px}.tag{display:inline-block;background:#f4e4d9;color:var(--accent-dark);padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800;margin:0 5px 8px 0}.measurements{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:11px}.measurement{border:1px solid var(--line);padding:11px;border-radius:8px}.measurement span{font-size:11px;color:var(--muted);display:block;text-transform:uppercase;letter-spacing:.05em}.measurement b{font-size:17px;margin-top:2px;display:block}.detail-actions{display:flex;gap:9px;margin-top:23px}
    dialog{border:0;border-radius:16px;padding:0;width:min(720px,calc(100% - 28px));box-shadow:0 20px 70px rgba(0,0,0,.26)}dialog::backdrop{background:rgba(42,31,24,.5)}.modal{padding:25px}.modal header{margin:-25px -25px 22px;padding:20px 25px;background:var(--ink)}.modal header h2{font:400 25px Georgia,serif;margin:0}.modal header button{color:#fff;background:none;border:0;font-size:26px;cursor:pointer}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.fields h3{grid-column:1/-1;font:400 20px Georgia,serif;margin:12px 0 -3px;color:var(--accent-dark)}label{font-size:12px;font-weight:800;color:var(--muted)}input,textarea,select{width:100%;display:block;margin-top:5px;padding:10px 11px;border:1px solid var(--line);border-radius:7px;background:#fffdfa;color:var(--ink);outline-color:var(--accent)}textarea{min-height:72px;resize:vertical}.full{grid-column:1/-1}.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}.danger{color:#a52d22;background:#fff0ee}
    @media(max-width:760px){header{padding:17px 18px}.brand p{display:none}.header-actions .quiet{display:none}main{padding:26px 15px}.topline{display:block}.search{margin-top:17px}.stats{gap:8px}.stat{padding:13px}.stat b{font-size:24px}.layout{grid-template-columns:1fr}.detail-panel{min-height:300px}.fields{grid-template-columns:1fr}.modal{padding:20px}.modal header{margin:-20px -20px 18px;padding:17px 20px}}
  </style>
</head>
<body>
  <header><div class="brand"><div class="mark">A</div><div><h1>ATELIER BOOK</h1><p>Client measurements &amp; fitting notes</p></div></div><div class="header-actions"><button class="button quiet" id="exportBtn">Export data</button><button class="button primary" id="addBtn">+ New client</button></div></header>
  <main>
    <div class="topline"><div><h2>Your client book</h2><p>Keep every fitting detail in one beautiful place.</p></div><input class="search" id="search" placeholder="Search clients, phone or style…" /></div>
    <section class="stats"><div class="stat"><b id="clientCount">0</b><span>Clients</span></div><div class="stat"><b id="orderCount">0</b><span>Active orders</span></div><div class="stat"><b id="updatedCount">—</b><span>Last updated</span></div></section>
    <section class="layout"><div class="panel"><div class="panel-head"><h3>Clients</h3><span id="resultCount"></span></div><div class="clients" id="clientList"></div></div><div class="panel detail-panel" id="detail"><div class="empty">Select a client to view their measurements.</div></div></section>
  </main>
  <dialog id="clientDialog"><form class="modal" id="clientForm" method="dialog"><header><h2 id="formTitle">New client</h2><button type="button" onclick="clientDialog.close()">×</button></header><input type="hidden" id="clientId"><div class="fields">
    <h3>Client details</h3><label>Full name<input required id="name" placeholder="e.g. Ama Mensah"></label><label>Phone number<input id="phone" placeholder="e.g. 024 000 0000"></label><label>Email<input type="email" id="email" placeholder="optional"></label><label>Preferred style<select id="style"><option>Traditional / occasion wear</option><option>Dress / gown</option><option>Suit / menswear</option><option>Casual wear</option><option>Other</option></select></label>
    <h3>Measurements <small>(cm)</small></h3><label>Bust / chest<input type="number" step="0.1" id="bust"></label><label>Waist<input type="number" step="0.1" id="waist"></label><label>Hips<input type="number" step="0.1" id="hips"></label><label>Shoulder<input type="number" step="0.1" id="shoulder"></label><label>Sleeve length<input type="number" step="0.1" id="sleeve"></label><label>Dress / shirt length<input type="number" step="0.1" id="length"></label><label>Inseam / trouser length<input type="number" step="0.1" id="inseam"></label><label>Neck<input type="number" step="0.1" id="neck"></label>
    <h3>Order &amp; notes</h3><label>Current order<input id="order" placeholder="e.g. Kente gown for wedding"></label><label>Delivery date<input type="date" id="delivery"></label><label class="full">Fitting notes<textarea id="notes" placeholder="Fabric preference, fit notes, alterations…"></textarea></label>
  </div><div class="modal-foot"><button class="button danger" type="button" id="deleteBtn" hidden>Delete client</button><button class="button soft" type="button" onclick="clientDialog.close()">Cancel</button><button class="button primary" type="submit">Save client</button></div></form></dialog>
  <script>
    const starter=[{id:'c1',name:'Ama Mensah',phone:'024 555 0186',email:'',style:'Traditional / occasion wear',bust:'94',waist:'76',hips:'104',shoulder:'38',sleeve:'57',length:'148',inseam:'',neck:'',order:'Kente gown for wedding',delivery:'2026-08-15',notes:'Prefers a comfortable waist and gold accents.',updated:'2026-07-22'},{id:'c2',name:'Esi Owusu',phone:'020 112 8460',email:'',style:'Dress / gown',bust:'88',waist:'69',hips:'98',shoulder:'36',sleeve:'54',length:'112',inseam:'',neck:'',order:'Bridesmaid dress',delivery:'2026-08-02',notes:'Final fitting one week before delivery.',updated:'2026-07-21'}];
    const key='atelier-book-clients-v1'; let clients=JSON.parse(localStorage.getItem(key)||'null')||starter, selected=null;
    const $=id=>document.getElementById(id), dialog=$('clientDialog'), fields=['name','phone','email','style','bust','waist','hips','shoulder','sleeve','length','inseam','neck','order','delivery','notes'];
    function save(){localStorage.setItem(key,JSON.stringify(clients))} function initials(n){return n.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase()}
    function render(){let q=$('search').value.toLowerCase(), list=clients.filter(c=>Object.values(c).join(' ').toLowerCase().includes(q));$('clientCount').textContent=clients.length;$('orderCount').textContent=clients.filter(c=>c.order).length;$('updatedCount').textContent=clients.length?new Date(Math.max(...clients.map(c=>new Date(c.updated||0)))).toLocaleDateString(undefined,{month:'short',day:'numeric'}):'—';$('resultCount').textContent=list.length+' shown';$('clientList').innerHTML=list.length?list.map(c=>`<div class="client ${selected===c.id?'active':''}" data-id="${c.id}"><div class="avatar">${initials(c.name)}</div><div class="client-info"><div class="client-name">${c.name}</div><div class="client-meta">${c.order||c.style||'No current order'}${c.delivery?' · '+new Date(c.delivery+'T00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'}):''}</div></div><div class="chevron">›</div></div>`).join(''):'<div class="empty">No clients match your search.</div>';document.querySelectorAll('.client').forEach(e=>e.onclick=()=>{selected=e.dataset.id;render();showDetail()});if(selected&&!clients.some(c=>c.id===selected)){selected=null;showDetail()}}
    function showDetail(){let c=clients.find(x=>x.id===selected);if(!c){$('detail').innerHTML='<div class="empty">Select a client to view their measurements.</div>';return}let ms=[['Bust / chest',c.bust],['Waist',c.waist],['Hips',c.hips],['Shoulder',c.shoulder],['Sleeve',c.sleeve],['Length',c.length],['Inseam',c.inseam],['Neck',c.neck]].filter(x=>x[1]);$('detail').innerHTML=`<div class="detail"><h3>${c.name}</h3><div class="sub">${c.phone||'No phone'}${c.email?' · '+c.email:''}</div><div><span class="tag">${c.style}</span>${c.order?'<span class="tag">'+c.order+'</span>':''}</div>${c.delivery?'<p class="sub">Delivery: <b>'+new Date(c.delivery+'T00:00').toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'})+'</b></p>':''}<h4>Measurements</h4><div class="measurements">${ms.length?ms.map(m=>'<div class="measurement"><span>'+m[0]+'</span><b>'+m[1]+' cm</b></div>').join(''):'<div class="sub">No measurements recorded yet.</div>'}</div>${c.notes?'<h4>Fitting notes</h4><p class="sub">'+c.notes+'</p>':''}<div class="detail-actions"><button class="button primary" id="editBtn">Edit client</button></div></div>`;$('editBtn').onclick=()=>openForm(c)}
    function openForm(c){$('clientForm').reset();$('clientId').value=c?.id||'';$('formTitle').textContent=c?'Edit '+c.name:'New client';$('deleteBtn').hidden=!c;fields.forEach(f=>$(f).value=c?.[f]||'');dialog.showModal()}
    $('addBtn').onclick=()=>openForm();$('search').oninput=render;$('clientForm').onsubmit=e=>{e.preventDefault();let id=$('clientId').value, obj={id:id||crypto.randomUUID(),updated:new Date().toISOString().slice(0,10)};fields.forEach(f=>obj[f]=$(f).value.trim());if(id){clients=clients.map(c=>c.id===id?{...c,...obj}:c)}else{clients.unshift(obj);selected=obj.id}save();dialog.close();render();showDetail()};$('deleteBtn').onclick=()=>{let c=clients.find(c=>c.id===$('clientId').value);if(c&&confirm('Delete '+c.name+'?')){clients=clients.filter(x=>x.id!==c.id);selected=null;save();dialog.close();render();showDetail()}};$('exportBtn').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(clients,null,2)],{type:'application/json'}));a.download='atelier-book-clients.json';a.click();URL.revokeObjectURL(a.href)};render();
  </script>
</body></html>
